name: Backend CI/CD

on:
  push:
    branches:
      - main
      - master
      - chess-Game-Application-BY-Gautam-Vidhate
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci-cd.yml"
  workflow_dispatch:

jobs:
  ci:
    name: Build and Docker Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Build Docker image
        run: docker build -t omenxis-backend:${{ github.sha }} .

  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: ci
    env:
      HAS_DEPLOY_SECRETS: ${{ secrets.DEPLOY_HOST != '' && secrets.DEPLOY_USER != '' && secrets.DEPLOY_SSH_KEY != '' && secrets.DEPLOY_PATH != '' && secrets.MONGO_URI != '' && secrets.JWT_SECRET != '' }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      PORT: ${{ secrets.PORT || '5000' }}
      NODE_ENV: production
      MONGO_URI: ${{ secrets.MONGO_URI }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN || '7d' }}
      ALLOWED_ORIGIN: ${{ secrets.ALLOWED_ORIGIN || '*' }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME || 'admin' }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_PROJECT_NUMBER: ${{ secrets.FIREBASE_PROJECT_NUMBER }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}

    steps:
      - name: Skip deploy when server secrets are missing
        if: env.HAS_DEPLOY_SECRETS != 'true'
        run: echo "Deployment skipped. Add DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_PATH, MONGO_URI, and JWT_SECRET secrets to enable it."

      - name: Checkout
        if: env.HAS_DEPLOY_SECRETS == 'true'
        uses: actions/checkout@v4

      - name: Copy backend to server
        if: env.HAS_DEPLOY_SECRETS == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          source: "backend/**"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Start backend on server
        if: env.HAS_DEPLOY_SECRETS == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          PORT: ${{ env.PORT }}
          NODE_ENV: ${{ env.NODE_ENV }}
          MONGO_URI: ${{ env.MONGO_URI }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ env.JWT_EXPIRES_IN }}
          ALLOWED_ORIGIN: ${{ env.ALLOWED_ORIGIN }}
          ADMIN_EMAIL: ${{ env.ADMIN_EMAIL }}
          ADMIN_USERNAME: ${{ env.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ env.ADMIN_PASSWORD }}
          FIREBASE_PROJECT_ID: ${{ env.FIREBASE_PROJECT_ID }}
          FIREBASE_PROJECT_NUMBER: ${{ env.FIREBASE_PROJECT_NUMBER }}
          FIREBASE_APP_ID: ${{ env.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ env.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          envs: PORT,NODE_ENV,MONGO_URI,JWT_SECRET,JWT_EXPIRES_IN,ALLOWED_ORIGIN,ADMIN_EMAIL,ADMIN_USERNAME,ADMIN_PASSWORD,FIREBASE_PROJECT_ID,FIREBASE_PROJECT_NUMBER,FIREBASE_APP_ID,FIREBASE_SERVICE_ACCOUNT_BASE64
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}/backend"

            cat > .env <<EOF
            NODE_ENV=${NODE_ENV}
            PORT=${PORT}
            MONGO_URI=${MONGO_URI}
            JWT_SECRET=${JWT_SECRET}
            JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
            ALLOWED_ORIGIN=${ALLOWED_ORIGIN}
            ADMIN_EMAIL=${ADMIN_EMAIL}
            ADMIN_USERNAME=${ADMIN_USERNAME}
            ADMIN_PASSWORD=${ADMIN_PASSWORD}
            FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
            FIREBASE_PROJECT_NUMBER=${FIREBASE_PROJECT_NUMBER}
            FIREBASE_APP_ID=${FIREBASE_APP_ID}
            FIREBASE_SERVICE_ACCOUNT_BASE64=${FIREBASE_SERVICE_ACCOUNT_BASE64}
            EOF

            docker compose -f docker-compose.prod.yml up -d --build
