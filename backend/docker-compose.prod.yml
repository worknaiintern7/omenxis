services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: omenxis-backend:latest
    container_name: omenxis-backend
    env_file:
      - .env
    ports:
      - "${PORT:-5000}:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
